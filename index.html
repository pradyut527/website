<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🕹️ Game Hub</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f1a;
    --card-bg: #1a1a2e;
    --text: #e0e0ff;
    --text-dim: #888aaa;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 20%, rgba(88,28,255,0.08) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 80%, rgba(0,255,136,0.05) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  /* HUB */
  #hub {
    position: relative;
    z-index: 1;
    max-width: 1200px;
    margin: 0 auto;
    padding: 40px 24px 60px;
  }
  .hub-header {
    text-align: center;
    margin-bottom: 48px;
  }
  .hub-title {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(18px, 4vw, 36px);
    background: linear-gradient(90deg, #00ff88, #a855f7, #ff6b6b, #4ecdc4, #ffd93d, #00ff88);
    background-size: 300%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: gradientFlow 4s linear infinite;
    text-shadow: none;
    line-height: 1.4;
  }
  .hub-subtitle {
    font-family: 'Rajdhani', sans-serif;
    color: var(--text-dim);
    font-size: 16px;
    margin-top: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
  }
  @keyframes gradientFlow {
    0% { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
  }

  /* GRID */
  .games-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
  }
  @media (max-width: 900px) {
    .games-grid { grid-template-columns: repeat(3, 1fr); }
  }
  @media (max-width: 600px) {
    .games-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
  }

  /* CARD */
  .game-card {
    background: var(--card-bg);
    border-radius: 16px;
    border: 1.5px solid rgba(255,255,255,0.07);
    padding: 24px 16px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    transition: transform 0.22s cubic-bezier(.34,1.56,.64,1), box-shadow 0.22s ease, border-color 0.22s ease;
    position: relative;
    overflow: hidden;
  }
  .game-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.03) 0%, transparent 60%);
    pointer-events: none;
  }
  .game-card:hover {
    transform: translateY(-6px) scale(1.03);
  }
  .icon-wrap {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    flex-shrink: 0;
  }
  .icon-wrap i {
    font-size: 34px;
    position: relative;
    z-index: 1;
  }
  .card-title {
    font-family: 'Press Start 2P', monospace;
    font-size: 7px;
    text-align: center;
    line-height: 1.6;
    letter-spacing: 0.5px;
  }
  .card-desc {
    font-size: 11px;
    color: var(--text-dim);
    text-align: center;
    line-height: 1.4;
    font-family: 'Rajdhani', sans-serif;
  }
  .play-btn {
    margin-top: 4px;
    padding: 7px 20px;
    border-radius: 8px;
    border: none;
    font-family: 'Press Start 2P', monospace;
    font-size: 7px;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.15s;
    letter-spacing: 1px;
    color: #000;
    font-weight: 900;
  }
  .play-btn:hover { opacity: 0.85; transform: scale(1.07); }

  /* MODAL */
  #modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(5,5,15,0.97);
    z-index: 1000;
    flex-direction: column;
  }
  #modal.open { display: flex; }
  .modal-header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 20px;
    background: rgba(0,0,0,0.4);
    border-bottom: 1px solid rgba(255,255,255,0.07);
    flex-shrink: 0;
  }
  .back-btn {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    color: #fff;
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-family: 'Press Start 2P', monospace;
    font-size: 8px;
    transition: background 0.2s;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .back-btn:hover { background: rgba(255,255,255,0.15); }
  .modal-game-title {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(9px, 2vw, 13px);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .modal-body {
    flex: 1;
    overflow: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  #game-container {
    width: 100%;
    max-width: 700px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  /* SCORE BAR */
  .score-bar {
    display: flex;
    gap: 24px;
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    width: 100%;
    max-width: 600px;
    justify-content: center;
  }
  .score-item { display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .score-label { font-size: 7px; color: var(--text-dim); }
  .score-val { font-size: 13px; }

  /* GAME OVER SCREEN */
  .game-over-screen {
    position: absolute;
    inset: 0;
    background: rgba(10,10,25,0.93);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    border-radius: 12px;
    z-index: 10;
  }
  .game-over-title {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(16px, 4vw, 28px);
    animation: pulse 1s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
  .game-over-score {
    font-family: 'Press Start 2P', monospace;
    font-size: 12px;
    color: var(--text-dim);
  }
  .restart-btn {
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    padding: 12px 24px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    transition: transform 0.15s;
  }
  .restart-btn:hover { transform: scale(1.08); }

  /* HOW TO PLAY */
  .how-to-play {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    padding: 14px 20px;
    font-size: 13px;
    color: var(--text-dim);
    max-width: 580px;
    width: 100%;
    line-height: 1.7;
    text-align: center;
  }
  .how-to-play strong {
    color: var(--text);
    font-size: 12px;
    font-family: 'Press Start 2P', monospace;
    display: block;
    margin-bottom: 8px;
  }

  /* Canvas wrapper */
  .canvas-wrap {
    position: relative;
    border-radius: 12px;
    overflow: hidden;
  }
  canvas {
    display: block;
    border-radius: 12px;
  }

  /* Minesweeper / Memory / Simon - DOM game styles */
  .dom-game {
    width: 100%;
    max-width: 500px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  /* Minesweeper */
  .ms-grid {
    display: grid;
    gap: 2px;
    background: #111;
    padding: 8px;
    border-radius: 10px;
    border: 2px solid #ffd93d44;
  }
  .ms-cell {
    width: 34px;
    height: 34px;
    background: #2a2a40;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    font-weight: bold;
    transition: background 0.12s;
    user-select: none;
    border: 1px solid rgba(255,255,255,0.07);
  }
  .ms-cell:hover:not(.revealed):not(.flagged) { background: #3a3a58; }
  .ms-cell.revealed { background: #111120; border-color: transparent; }
  .ms-cell.flagged { background: #2a2a40; }
  .ms-cell.mine-exploded { background: #ff2244 !important; }
  /* Memory */
  .mem-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    width: 100%;
    max-width: 400px;
  }
  .mem-card {
    aspect-ratio: 1;
    background: #2a2a3e;
    border-radius: 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    border: 2px solid rgba(168,85,247,0.2);
    transition: transform 0.3s, background 0.3s;
    user-select: none;
    transform: rotateY(180deg);
  }
  .mem-card.flipped { transform: rotateY(0deg); background: #3a2a5e; border-color: #a855f7; }
  .mem-card.matched { background: #1a3a2e; border-color: #00ff88; opacity: 0.7; }
  /* Pong DOM display */
  .mole-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    max-width: 340px;
    width: 100%;
  }
  .mole-hole {
    aspect-ratio: 1;
    background: #1a1a2e;
    border-radius: 50%;
    border: 3px solid #2a2a4e;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 40px;
    transition: transform 0.1s;
    user-select: none;
    overflow: hidden;
    position: relative;
  }
  .mole-hole .mole {
    position: absolute;
    font-size: 44px;
    bottom: -60px;
    transition: bottom 0.2s;
    line-height: 1;
  }
  .mole-hole.active .mole { bottom: -4px; }
  .mole-hole.active { border-color: #ec4899; }
  .mole-hole:active { transform: scale(0.93); }

  /* Pong DOM display */
  #pong-score-display {
    font-family: 'Press Start 2P', monospace;
    font-size: 28px;
    letter-spacing: 30px;
    text-align: center;
    color: rgba(255,255,255,0.8);
  }

  /* Pause overlay */
  .pause-overlay {
    position: absolute;
    inset: 0;
    background: rgba(5,5,20,0.8);
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    font-family: 'Press Start 2P', monospace;
    font-size: 20px;
    color: #fff;
    z-index: 5;
  }
</style>
</head>
<body>

<!-- HUB -->
<div id="hub">
  <div class="hub-header">
    <div class="hub-title">🕹️ GAME HUB</div>
    <div class="hub-subtitle"></div>
  </div>
  <div class="games-grid" id="gamesGrid"></div>
</div>

<!-- MODAL -->
<div id="modal">
  <div class="modal-header">
    <button class="back-btn" onclick="closeModal()">
      <i class="bi bi-arrow-left"></i> BACK
    </button>
    <div class="modal-game-title" id="modalTitle"></div>
  </div>
  <div class="modal-body">
    <div id="game-container"></div>
  </div>
</div>

<script>
// =============================================
// GAME DEFINITIONS
// =============================================
const GAMES = [
  { id:'snake',   name:'Snake',        icon:'bi-arrow-up-right-circle-fill', color:'#00ff88', desc:'Eat food, grow longer' },
  { id:'tetris',  name:'Tetris',        icon:'bi-grid-3x3-gap-fill',          color:'#ff6b6b', desc:'Clear lines to survive' },
  { id:'mines',   name:'Minesweeper',   icon:'bi-bomb-fill',                  color:'#ffd93d', desc:'Find all mines safely' },
  { id:'pong',    name:'Pong',          icon:'bi-circle-fill',                color:'#4ecdc4', desc:'Two player paddle battle' },
  { id:'memory',  name:'Memory Match',  icon:'bi-grid-fill',                  color:'#a855f7', desc:'Find all matching pairs' },
  { id:'flappy',  name:'Flappy Bird',   icon:'bi-controller',                 color:'#f97316', desc:'Dodge the pipes!' },
  { id:'mole',    name:'Whack-a-Mole',  icon:'bi-hammer-fill',                color:'#ec4899', desc:'Bonk moles for points' },
  { id:'breakout',name:'Breakout',      icon:'bi-bricks',                     color:'#84cc16', desc:'Break all the bricks' },
];

// Build hub cards
const grid = document.getElementById('gamesGrid');
GAMES.forEach(g => {
  const card = document.createElement('div');
  card.className = 'game-card';
  card.style.borderColor = g.color + '44';
  card.innerHTML = `
    <div class="icon-wrap" style="background:${g.color}22; box-shadow:0 0 20px ${g.color}33">
      <i class="bi ${g.icon}" style="color:${g.color}"></i>
    </div>
    <div class="card-title" style="color:${g.color}">${g.name}</div>
    <div class="card-desc">${g.desc}</div>
    <button class="play-btn" style="background:${g.color}; color:#000">PLAY</button>
  `;
  card.addEventListener('click', () => openGame(g));
  card.addEventListener('mouseenter', () => {
    card.style.boxShadow = `0 8px 32px ${g.color}44, 0 0 0 1px ${g.color}66`;
    card.style.borderColor = g.color + 'aa';
  });
  card.addEventListener('mouseleave', () => {
    card.style.boxShadow = '';
    card.style.borderColor = g.color + '44';
  });
  grid.appendChild(card);
});

// Modal state
let currentGame = null;
let stopCurrentGame = null;

function openGame(g) {
  currentGame = g;
  document.getElementById('modal').classList.add('open');
  const mt = document.getElementById('modalTitle');
  mt.innerHTML = `<i class="bi ${g.icon}" style="color:${g.color}"></i><span style="color:${g.color}">${g.name}</span>`;
  document.body.style.overflow = 'hidden';
  buildGame(g);
}

function closeModal() {
  if (stopCurrentGame) { stopCurrentGame(); stopCurrentGame = null; }
  document.getElementById('modal').classList.remove('open');
  document.getElementById('game-container').innerHTML = '';
  document.body.style.overflow = '';
  currentGame = null;
}

function getHS(id) { return parseInt(localStorage.getItem('hs_'+id)||'0'); }
function setHS(id, val) { if(val>getHS(id)) localStorage.setItem('hs_'+id, val); }

// =============================================
// GAME ROUTER
// =============================================
function buildGame(g) {
  const container = document.getElementById('game-container');
  container.innerHTML = '';
  if(stopCurrentGame) { stopCurrentGame(); stopCurrentGame = null; }
  switch(g.id) {
    case 'snake':   buildSnake(container, g); break;
    case 'tetris':  buildTetris(container, g); break;
    case 'mines':   buildMines(container, g); break;
    case 'pong':    buildPong(container, g); break;
    case 'memory':  buildMemory(container, g); break;
    case 'flappy':  buildFlappy(container, g); break;
    case 'mole':    buildMole(container, g); break;
    case 'breakout':buildBreakout(container, g); break;
  }
}

// =============================================
// SNAKE
// =============================================
function buildSnake(container, g) {
  const W=400, H=400, SZ=20, cols=W/SZ, rows=H/SZ;
  container.innerHTML = `
    <div class="score-bar">
      <div class="score-item"><span class="score-label">SCORE</span><span class="score-val" id="snScore" style="color:${g.color}">0</span></div>
      <div class="score-item"><span class="score-label">BEST</span><span class="score-val" id="snBest">${getHS('snake')}</span></div>
    </div>
    <div class="canvas-wrap">
      <canvas id="snCanvas" width="${W}" height="${H}" style="background:#0d0d1a"></canvas>
    </div>
    <div class="how-to-play"><strong>HOW TO PLAY</strong>Arrow keys to move · Eat food to grow · Don't hit walls or yourself · P to pause</div>
  `;
  const canvas = document.getElementById('snCanvas');
  const ctx = canvas.getContext('2d');
  let snake, dir, nextDir, food, score, paused, dead, raf;

  function init() {
    snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
    dir = {x:1,y:0}; nextDir = {x:1,y:0};
    food = randomFood();
    score = 0; paused = false; dead = false;
    document.getElementById('snScore').textContent = '0';
    loop();
  }

  function randomFood() {
    let f;
    do { f = {x:Math.floor(Math.random()*cols), y:Math.floor(Math.random()*rows)}; }
    while(snake.some(s=>s.x===f.x&&s.y===f.y));
    return f;
  }

  let lastTime=0;
  const SPEED=130;
  function loop(ts=0) {
    raf = requestAnimationFrame(loop);
    if(dead||paused) return;
    if(ts-lastTime<SPEED) return;
    lastTime=ts;
    dir=nextDir;
    const head={x:(snake[0].x+dir.x+cols)%cols, y:(snake[0].y+dir.y+rows)%rows};
    if(snake.some(s=>s.x===head.x&&s.y===head.y)) { gameOver(); return; }
    snake.unshift(head);
    if(head.x===food.x&&head.y===food.y) {
      score++;
      document.getElementById('snScore').textContent=score;
      setHS('snake',score);
      document.getElementById('snBest').textContent=getHS('snake');
      food=randomFood();
    } else { snake.pop(); }
    draw();
  }

  function draw() {
    ctx.fillStyle='#0d0d1a'; ctx.fillRect(0,0,W,H);
    // grid
    ctx.strokeStyle='rgba(255,255,255,0.03)'; ctx.lineWidth=0.5;
    for(let i=0;i<=cols;i++){ctx.beginPath();ctx.moveTo(i*SZ,0);ctx.lineTo(i*SZ,H);ctx.stroke();}
    for(let j=0;j<=rows;j++){ctx.beginPath();ctx.moveTo(0,j*SZ);ctx.lineTo(W,j*SZ);ctx.stroke();}
    // food
    ctx.shadowBlur=15; ctx.shadowColor=g.color;
    ctx.fillStyle=g.color;
    ctx.beginPath();
    ctx.arc(food.x*SZ+SZ/2, food.y*SZ+SZ/2, SZ/2-2, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur=0;
    // snake
    snake.forEach((s,i)=>{
      const alpha = 1 - (i/snake.length)*0.5;
      ctx.fillStyle = i===0 ? g.color : `rgba(0,200,100,${alpha})`;
      if(i===0){ctx.shadowBlur=10;ctx.shadowColor=g.color;}
      ctx.beginPath();
      ctx.roundRect(s.x*SZ+1, s.y*SZ+1, SZ-2, SZ-2, 4);
      ctx.fill();
      ctx.shadowBlur=0;
    });
  }

  function gameOver() {
    dead=true;
    cancelAnimationFrame(raf);
    setHS('snake', score);
    // overlay
    const wrap = document.querySelector('.canvas-wrap');
    const ov = document.createElement('div');
    ov.className='game-over-screen';
    ov.innerHTML=`<div class="game-over-title" style="color:${g.color}">GAME OVER</div>
      <div class="game-over-score">Score: ${score}</div>
      <button class="restart-btn" style="background:${g.color};color:#000">PLAY AGAIN</button>`;
    wrap.style.position='relative';
    wrap.appendChild(ov);
    ov.querySelector('.restart-btn').onclick=()=>{ov.remove();init();};
  }

  const keyH = e => {
    const map={ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0}};
    if(map[e.key]){
      const d=map[e.key];
      if(d.x===-dir.x&&d.y===-dir.y) return;
      nextDir=d; e.preventDefault();
    }
    if(e.key==='p'||e.key==='P'){paused=!paused;}
  };
  document.addEventListener('keydown',keyH);
  stopCurrentGame=()=>{cancelAnimationFrame(raf);document.removeEventListener('keydown',keyH);};
  init();
}

// =============================================
// TETRIS
// =============================================
function buildTetris(container, g) {
  const W=200,H=400,SZ=20,COLS=10,ROWS=20;
  container.innerHTML=`
    <div class="score-bar">
      <div class="score-item"><span class="score-label">SCORE</span><span class="score-val" id="tetScore" style="color:${g.color}">0</span></div>
      <div class="score-item"><span class="score-label">LINES</span><span class="score-val" id="tetLines" style="color:${g.color}">0</span></div>
      <div class="score-item"><span class="score-label">BEST</span><span class="score-val" id="tetBest">${getHS('tetris')}</span></div>
    </div>
    <div class="canvas-wrap">
      <canvas id="tetCanvas" width="${W}" height="${H}" style="background:#090912"></canvas>
    </div>
    <div class="how-to-play"><strong>HOW TO PLAY</strong>← → to move · ↑ rotate · ↓ soft drop · Space hard drop · P pause</div>
  `;
  const canvas=document.getElementById('tetCanvas');
  const ctx=canvas.getContext('2d');
  const PIECES=[
    {shape:[[1,1,1,1]],color:'#4ecdc4'},
    {shape:[[1,1],[1,1]],color:'#ffd93d'},
    {shape:[[1,1,1],[0,1,0]],color:'#a855f7'},
    {shape:[[1,1,1],[1,0,0]],color:'#f97316'},
    {shape:[[1,1,1],[0,0,1]],color:'#3b82f6'},
    {shape:[[1,1,0],[0,1,1]],color:'#00ff88'},
    {shape:[[0,1,1],[1,1,0]],color:'#ff6b6b'},
  ];
  let board,piece,score,lines,paused,dead,raf,speed,lastTime;

  function init(){
    board=Array.from({length:ROWS},()=>Array(COLS).fill(0));
    score=0;lines=0;paused=false;dead=false;speed=500;lastTime=0;
    document.getElementById('tetScore').textContent='0';
    document.getElementById('tetLines').textContent='0';
    spawnPiece(); loop();
  }
  function spawnPiece(){
    const p=PIECES[Math.floor(Math.random()*PIECES.length)];
    piece={shape:p.shape.map(r=>[...r]),color:p.color,x:Math.floor(COLS/2)-Math.floor(p.shape[0].length/2),y:0};
    if(collide(piece)){dead=true;gameOver();}
  }
  function collide(p,dx=0,dy=0,sh=null){
    const shape=sh||p.shape;
    for(let r=0;r<shape.length;r++) for(let c=0;c<shape[r].length;c++){
      if(!shape[r][c]) continue;
      const nx=p.x+c+dx, ny=p.y+r+dy;
      if(nx<0||nx>=COLS||ny>=ROWS) return true;
      if(ny>=0&&board[ny][nx]) return true;
    }
    return false;
  }
  function rotate(shape){
    return shape[0].map((_,i)=>shape.map(r=>r[i]).reverse());
  }
  function lock(){
    piece.shape.forEach((r,ri)=>r.forEach((v,ci)=>{
      if(v&&piece.y+ri>=0) board[piece.y+ri][piece.x+ci]=piece.color;
    }));
    // clear lines
    let cleared=0;
    for(let r=ROWS-1;r>=0;r--){
      if(board[r].every(c=>c)){board.splice(r,1);board.unshift(Array(COLS).fill(0));cleared++;r++;}
    }
    lines+=cleared;
    const pts=[0,100,300,500,800];
    score+=pts[cleared]||0;
    speed=Math.max(100,500-lines*15);
    document.getElementById('tetScore').textContent=score;
    document.getElementById('tetLines').textContent=lines;
    setHS('tetris',score);
    document.getElementById('tetBest').textContent=getHS('tetris');
    spawnPiece();
  }
  function hardDrop(){
    while(!collide(piece,0,1)) piece.y++;
    lock();
  }
  function loop(ts=0){
    raf=requestAnimationFrame(loop);
    if(paused||dead) return;
    if(ts-lastTime>speed){
      lastTime=ts;
      if(!collide(piece,0,1)) piece.y++;
      else lock();
    }
    draw();
  }
  function draw(){
    ctx.fillStyle='#090912'; ctx.fillRect(0,0,W,H);
    // grid lines
    ctx.strokeStyle='rgba(255,255,255,0.04)';ctx.lineWidth=0.5;
    for(let i=0;i<=COLS;i++){ctx.beginPath();ctx.moveTo(i*SZ,0);ctx.lineTo(i*SZ,H);ctx.stroke();}
    for(let j=0;j<=ROWS;j++){ctx.beginPath();ctx.moveTo(0,j*SZ);ctx.lineTo(W,j*SZ);ctx.stroke();}
    // board
    board.forEach((row,r)=>row.forEach((c,col)=>{
      if(c){ctx.fillStyle=c;ctx.beginPath();ctx.roundRect(col*SZ+1,r*SZ+1,SZ-2,SZ-2,2);ctx.fill();}
    }));
    // ghost
    let ghostY=piece.y;
    while(!collide(piece,0,ghostY-piece.y+1)) ghostY++;
    ctx.fillStyle='rgba(255,255,255,0.1)';
    piece.shape.forEach((r,ri)=>r.forEach((v,ci)=>{
      if(v){ctx.beginPath();ctx.roundRect((piece.x+ci)*SZ+1,(ghostY+ri)*SZ+1,SZ-2,SZ-2,2);ctx.fill();}
    }));
    // piece
    ctx.fillStyle=piece.color;
    ctx.shadowBlur=8;ctx.shadowColor=piece.color;
    piece.shape.forEach((r,ri)=>r.forEach((v,ci)=>{
      if(v){ctx.beginPath();ctx.roundRect((piece.x+ci)*SZ+1,(piece.y+ri)*SZ+1,SZ-2,SZ-2,2);ctx.fill();}
    }));
    ctx.shadowBlur=0;
  }
  function gameOver(){
    cancelAnimationFrame(raf);
    const wrap=document.querySelector('.canvas-wrap');
    wrap.style.position='relative';
    const ov=document.createElement('div');
    ov.className='game-over-screen';
    ov.innerHTML=`<div class="game-over-title" style="color:${g.color}">GAME OVER</div>
      <div class="game-over-score">Score: ${score}</div>
      <button class="restart-btn" style="background:${g.color};color:#000">PLAY AGAIN</button>`;
    wrap.appendChild(ov);
    ov.querySelector('.restart-btn').onclick=()=>{ov.remove();init();};
  }
  const keyH=e=>{
    if(dead) return;
    if(e.key==='ArrowLeft'&&!collide(piece,-1,0)){piece.x--;e.preventDefault();}
    if(e.key==='ArrowRight'&&!collide(piece,1,0)){piece.x++;e.preventDefault();}
    if(e.key==='ArrowDown'&&!collide(piece,0,1)){piece.y++;e.preventDefault();}
    if(e.key==='ArrowUp'){
      const r=rotate(piece.shape);
      if(!collide(piece,0,0,r)) piece.shape=r;
      e.preventDefault();
    }
    if(e.key===' '){hardDrop();e.preventDefault();}
    if(e.key==='p'||e.key==='P') paused=!paused;
  };
  document.addEventListener('keydown',keyH);
  stopCurrentGame=()=>{cancelAnimationFrame(raf);document.removeEventListener('keydown',keyH);};
  init();
}

// =============================================
// MINESWEEPER
// =============================================
function buildMines(container, g) {
  const ROWS=9,COLS=9,MINES=10;
  container.innerHTML=`
    <div class="score-bar">
      <div class="score-item"><span class="score-label">FLAGS</span><span class="score-val" id="msFlags" style="color:${g.color}">${MINES}</span></div>
      <div class="score-item"><span class="score-label">TIME</span><span class="score-val" id="msTime">0</span></div>
      <div class="score-item"><span class="score-label">BEST</span><span class="score-val" id="msBest">${getHS('mines')?getHS('mines')+'s':'--'}</span></div>
    </div>
    <div class="dom-game">
      <div class="ms-grid" id="msGrid" style="grid-template-columns:repeat(${COLS},34px)"></div>
      <div class="how-to-play"><strong>HOW TO PLAY</strong>Left click to reveal · Right click to flag · Find all ${MINES} mines!</div>
    </div>
  `;
  let board,revealed,flagged,timer,elapsed,started,dead;
  function init(){
    board=Array.from({length:ROWS},()=>Array(COLS).fill(0));
    revealed=Array.from({length:ROWS},()=>Array(COLS).fill(false));
    flagged=Array.from({length:ROWS},()=>Array(COLS).fill(false));
    elapsed=0;started=false;dead=false;
    document.getElementById('msTime').textContent='0';
    document.getElementById('msFlags').textContent=MINES;
    clearInterval(timer);
    render();
  }
  function plantMines(fr,fc){
    let placed=0;
    while(placed<MINES){
      const r=Math.floor(Math.random()*ROWS),c=Math.floor(Math.random()*COLS);
      if(board[r][c]===-1||(Math.abs(r-fr)<=1&&Math.abs(c-fc)<=1)) continue;
      board[r][c]=-1;placed++;
    }
    for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
      if(board[r][c]===-1) continue;
      let cnt=0;
      for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++){
        const nr=r+dr,nc=c+dc;
        if(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS&&board[nr][nc]===-1) cnt++;
      }
      board[r][c]=cnt;
    }
  }
  function reveal(r,c){
    if(r<0||r>=ROWS||c<0||c>=COLS||revealed[r][c]||flagged[r][c]) return;
    revealed[r][c]=true;
    if(board[r][c]===0) for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++) reveal(r+dr,c+dc);
  }
  const COLORS=['','#3b82f6','#00ff88','#ff6b6b','#a855f7','#f97316','#4ecdc4','#000','#555'];
  function render(){
    const grid=document.getElementById('msGrid');
    grid.innerHTML='';
    for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
      const cell=document.createElement('div');
      cell.className='ms-cell';
      if(revealed[r][c]){
        cell.classList.add('revealed');
        if(board[r][c]===-1){cell.textContent='💣';cell.classList.add('mine-exploded');}
        else if(board[r][c]>0){cell.textContent=board[r][c];cell.style.color=COLORS[board[r][c]];}
      } else if(flagged[r][c]){
        cell.textContent='🚩';cell.classList.add('flagged');
      }
      const rr=r,cc=c;
      cell.addEventListener('click',()=>{
        if(dead||revealed[rr][cc]||flagged[rr][cc]) return;
        if(!started){
          started=true;
          plantMines(rr,cc);
          timer=setInterval(()=>{elapsed++;document.getElementById('msTime').textContent=elapsed;},1000);
        }
        if(board[rr][cc]===-1){ revealAll(); dead=true; clearInterval(timer); showResult(false); }
        else { reveal(rr,cc); render(); checkWin(); }
      });
      cell.addEventListener('contextmenu',e=>{
        e.preventDefault();
        if(dead||revealed[rr][cc]) return;
        flagged[rr][cc]=!flagged[rr][cc];
        const flags=flagged.flat().filter(Boolean).length;
        document.getElementById('msFlags').textContent=MINES-flags;
        render();
      });
      grid.appendChild(cell);
    }
  }
  function revealAll(){
    for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++) revealed[r][c]=true;
    render();
  }
  function checkWin(){
    let unrevealed=0;
    for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++) if(!revealed[r][c]) unrevealed++;
    if(unrevealed===MINES){clearInterval(timer);dead=true;setHS('mines',elapsed);showResult(true);}
  }
  function showResult(won){
    const dom=document.querySelector('.dom-game');
    const ov=document.createElement('div');
    ov.className='game-over-screen';
    ov.style.borderRadius='10px';
    ov.innerHTML=`<div class="game-over-title" style="color:${won?g.color:'#ff4444'}">${won?'YOU WIN!':'BOOM!'}</div>
      <div class="game-over-score">${won?'Time: '+elapsed+'s':'Better luck next time!'}</div>
      <button class="restart-btn" style="background:${g.color};color:#000">PLAY AGAIN</button>`;
    dom.style.position='relative';dom.appendChild(ov);
    ov.querySelector('.restart-btn').onclick=()=>{ov.remove();init();};
  }
  init();
  stopCurrentGame=()=>{clearInterval(timer);};
}

// =============================================
// PONG
// =============================================
function buildPong(container, g) {
  const W=500,H=350;
  container.innerHTML=`
    <div id="pong-score-display"><span id="pScore1">0</span>  <span id="pScore2">0</span></div>
    <div class="canvas-wrap">
      <canvas id="pongCanvas" width="${W}" height="${H}" style="background:#040410"></canvas>
    </div>
    <div class="how-to-play"><strong>HOW TO PLAY</strong>W/S = Left paddle · ↑/↓ = Right paddle · First to 7 wins · P to pause</div>
  `;
  const canvas=document.getElementById('pongCanvas');
  const ctx=canvas.getContext('2d');
  const PW=10,PH=70,SPEED=4,WIN=7;
  let p1,p2,ball,score1,score2,paused,dead,raf,keys={};

  function init(){
    p1={x:10,y:H/2-PH/2};p2={x:W-PW-10,y:H/2-PH/2};
    ball={x:W/2,y:H/2,vx:(Math.random()>0.5?1:-1)*4,vy:(Math.random()*4-2)};
    score1=0;score2=0;paused=false;dead=false;
    document.getElementById('pScore1').textContent='0';
    document.getElementById('pScore2').textContent='0';
    loop();
  }
  function loop(){
    raf=requestAnimationFrame(loop);
    if(paused||dead) return;
    // paddles
    if(keys['w']||keys['W']) p1.y=Math.max(0,p1.y-SPEED);
    if(keys['s']||keys['S']) p1.y=Math.min(H-PH,p1.y+SPEED);
    if(keys['ArrowUp']) p2.y=Math.max(0,p2.y-SPEED);
    if(keys['ArrowDown']) p2.y=Math.min(H-PH,p2.y+SPEED);
    // ball
    ball.x+=ball.vx;ball.y+=ball.vy;
    if(ball.y<=4||ball.y>=H-4) ball.vy*=-1;
    // p1 hit
    if(ball.x<=p1.x+PW&&ball.x>=p1.x&&ball.y>=p1.y&&ball.y<=p1.y+PH){
      ball.vx=Math.abs(ball.vx)*1.04;
      ball.vy+=((ball.y-(p1.y+PH/2))/PH)*4;
    }
    // p2 hit
    if(ball.x>=p2.x&&ball.x<=p2.x+PW&&ball.y>=p2.y&&ball.y<=p2.y+PH){
      ball.vx=-Math.abs(ball.vx)*1.04;
      ball.vy+=((ball.y-(p2.y+PH/2))/PH)*4;
    }
    // clamp speed
    const spd=Math.sqrt(ball.vx**2+ball.vy**2);
    if(spd>12){ball.vx=ball.vx/spd*12;ball.vy=ball.vy/spd*12;}
    // score
    if(ball.x<0){score2++;document.getElementById('pScore2').textContent=score2;resetBall(-1);}
    if(ball.x>W){score1++;document.getElementById('pScore1').textContent=score1;resetBall(1);}
    if(score1>=WIN||score2>=WIN){dead=true;gameOver();}
    draw();
  }
  function resetBall(dir){
    ball={x:W/2,y:H/2,vx:dir*4,vy:(Math.random()*4-2)};
  }
  function draw(){
    ctx.fillStyle='#040410';ctx.fillRect(0,0,W,H);
    // center line
    ctx.setLineDash([8,8]);ctx.strokeStyle='rgba(255,255,255,0.15)';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(W/2,0);ctx.lineTo(W/2,H);ctx.stroke();ctx.setLineDash([]);
    // paddles
    ctx.fillStyle=g.color;ctx.shadowBlur=12;ctx.shadowColor=g.color;
    ctx.beginPath();ctx.roundRect(p1.x,p1.y,PW,PH,4);ctx.fill();
    ctx.beginPath();ctx.roundRect(p2.x,p2.y,PW,PH,4);ctx.fill();
    // ball
    ctx.beginPath();ctx.arc(ball.x,ball.y,6,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
  }
  function gameOver(){
    cancelAnimationFrame(raf);
    const wrap=document.querySelector('.canvas-wrap');
    wrap.style.position='relative';
    const winner=score1>=WIN?'LEFT':'RIGHT';
    const ov=document.createElement('div');
    ov.className='game-over-screen';
    ov.innerHTML=`<div class="game-over-title" style="color:${g.color}">${winner} WINS!</div>
      <div class="game-over-score">${score1} - ${score2}</div>
      <button class="restart-btn" style="background:${g.color};color:#000">PLAY AGAIN</button>`;
    wrap.appendChild(ov);
    ov.querySelector('.restart-btn').onclick=()=>{ov.remove();init();};
  }
  const keyD=e=>{keys[e.key]=true;if(['ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault();if(e.key==='p'||e.key==='P')paused=!paused;};
  const keyU=e=>{keys[e.key]=false;};
  document.addEventListener('keydown',keyD);
  document.addEventListener('keyup',keyU);
  stopCurrentGame=()=>{cancelAnimationFrame(raf);document.removeEventListener('keydown',keyD);document.removeEventListener('keyup',keyU);};
  init();
}

// =============================================
// MEMORY MATCH
// =============================================
function buildMemory(container, g) {
  const EMOJIS=['🍎','🍊','🍋','🍇','🍓','🎮','🚀','🎯'];
  container.innerHTML=`
    <div class="score-bar">
      <div class="score-item"><span class="score-label">PAIRS</span><span class="score-val" id="memPairs" style="color:${g.color}">0/8</span></div>
      <div class="score-item"><span class="score-label">MOVES</span><span class="score-val" id="memMoves">0</span></div>
      <div class="score-item"><span class="score-label">BEST</span><span class="score-val" id="memBest">${getHS('memory')?getHS('memory'):'--'}</span></div>
    </div>
    <div class="dom-game">
      <div class="mem-grid" id="memGrid"></div>
      <div class="how-to-play"><strong>HOW TO PLAY</strong>Click cards to flip them · Match all 8 pairs to win!</div>
    </div>
  `;
  let cards,flipped,matched,moves,lock;
  function init(){
    const deck=[...EMOJIS,...EMOJIS].sort(()=>Math.random()-0.5);
    cards=deck.map((e,i)=>({emoji:e,id:i,flipped:false,matched:false}));
    flipped=[];matched=0;moves=0;lock=false;
    document.getElementById('memPairs').textContent='0/8';
    document.getElementById('memMoves').textContent='0';
    render();
  }
  function render(){
    const grid=document.getElementById('memGrid');
    grid.innerHTML='';
    cards.forEach((c,i)=>{
      const el=document.createElement('div');
      el.className='mem-card'+(c.flipped||c.matched?' flipped':'')+(c.matched?' matched':'');
      el.textContent=c.flipped||c.matched?c.emoji:'';
      el.addEventListener('click',()=>flip(i));
      grid.appendChild(el);
    });
  }
  function flip(i){
    if(lock||cards[i].flipped||cards[i].matched) return;
    cards[i].flipped=true;flipped.push(i);render();
    if(flipped.length===2){
      lock=true;moves++;
      document.getElementById('memMoves').textContent=moves;
      const [a,b]=flipped;
      if(cards[a].emoji===cards[b].emoji){
        cards[a].matched=cards[b].matched=true;
        matched++;
        document.getElementById('memPairs').textContent=matched+'/8';
        flipped=[];lock=false;render();
        if(matched===8){setHS('memory',moves);document.getElementById('memBest').textContent=getHS('memory');showWin();}
      } else {
        setTimeout(()=>{cards[a].flipped=cards[b].flipped=false;flipped=[];lock=false;render();},900);
      }
    }
  }
  function showWin(){
    const dom=document.querySelector('.dom-game');
    const ov=document.createElement('div');
    ov.className='game-over-screen';ov.style.borderRadius='10px';
    ov.innerHTML=`<div class="game-over-title" style="color:${g.color}">YOU WIN!</div>
      <div class="game-over-score">${moves} moves</div>
      <button class="restart-btn" style="background:${g.color};color:#000">PLAY AGAIN</button>`;
    dom.style.position='relative';dom.appendChild(ov);
    ov.querySelector('.restart-btn').onclick=()=>{ov.remove();init();};
  }
  stopCurrentGame=()=>{};
  init();
}

// =============================================
// FLAPPY BIRD
// =============================================
function buildFlappy(container, g) {
  const W=360,H=480,GAP=140,PIPE_W=52,GRAVITY=0.45,JUMP=-8;
  container.innerHTML=`
    <div class="score-bar">
      <div class="score-item"><span class="score-label">SCORE</span><span class="score-val" id="flScore" style="color:${g.color}">0</span></div>
      <div class="score-item"><span class="score-label">BEST</span><span class="score-val" id="flBest">${getHS('flappy')}</span></div>
    </div>
    <div class="canvas-wrap">
      <canvas id="flCanvas" width="${W}" height="${H}" style="background:#0a1628; cursor:pointer"></canvas>
    </div>
    <div class="how-to-play"><strong>HOW TO PLAY</strong>Space or Click to flap · Avoid the pipes!</div>
  `;
  const canvas=document.getElementById('flCanvas');
  const ctx=canvas.getContext('2d');
  let bird,pipes,score,dead,started,raf,paused;

  function init(){
    bird={x:80,y:H/2,vy:0,r:14};
    pipes=[];score=0;dead=false;started=false;paused=false;
    document.getElementById('flScore').textContent='0';
  }
  function addPipe(){
    const top=80+Math.random()*(H-GAP-160);
    pipes.push({x:W,top,passed:false});
  }
  let pipeTimer=0;
  function loop(){
    raf=requestAnimationFrame(loop);
    if(!started||paused||dead){draw();return;}
    bird.vy+=GRAVITY;bird.y+=bird.vy;
    if(bird.y+bird.r>H||bird.y-bird.r<0){dead=true;gameOver();return;}
    pipeTimer++;
    if(pipeTimer%90===0) addPipe();
    for(let p of pipes){
      p.x-=2.5;
      // collide
      if(bird.x+bird.r>p.x&&bird.x-bird.r<p.x+PIPE_W){
        if(bird.y-bird.r<p.top||bird.y+bird.r>p.top+GAP){dead=true;gameOver();return;}
      }
      if(!p.passed&&bird.x>p.x+PIPE_W){
        p.passed=true;score++;
        document.getElementById('flScore').textContent=score;
        setHS('flappy',score);
        document.getElementById('flBest').textContent=getHS('flappy');
      }
    }
    pipes=pipes.filter(p=>p.x>-PIPE_W-10);
    draw();
  }
  function draw(){
    ctx.fillStyle='#0a1628';ctx.fillRect(0,0,W,H);
    // bg stars
    ctx.fillStyle='rgba(255,255,255,0.4)';
    [[50,80],[150,40],[280,100],[320,200],[100,300],[240,380],[60,420]].forEach(([x,y])=>{
      ctx.beginPath();ctx.arc(x,y,1,0,Math.PI*2);ctx.fill();
    });
    // pipes
    pipes.forEach(p=>{
      ctx.fillStyle='#2d7a2d';
      ctx.beginPath();ctx.roundRect(p.x,0,PIPE_W,p.top,4);ctx.fill();
      ctx.beginPath();ctx.roundRect(p.x,p.top+GAP,PIPE_W,H-(p.top+GAP),4);ctx.fill();
      // cap
      ctx.fillStyle='#3a9a3a';
      ctx.beginPath();ctx.roundRect(p.x-4,p.top-14,PIPE_W+8,14,4);ctx.fill();
      ctx.beginPath();ctx.roundRect(p.x-4,p.top+GAP,PIPE_W+8,14,4);ctx.fill();
    });
    // bird
    ctx.save();
    ctx.translate(bird.x,bird.y);
    ctx.rotate(Math.min(Math.PI/4,bird.vy*0.05));
    ctx.shadowBlur=12;ctx.shadowColor=g.color;
    ctx.fillStyle=g.color;
    ctx.beginPath();ctx.arc(0,0,bird.r,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(5,-3,5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#000';ctx.beginPath();ctx.arc(7,-3,2.5,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;ctx.restore();
    if(!started){
      ctx.fillStyle='rgba(0,0,0,0.4)';ctx.fillRect(0,0,W,H);
      ctx.fillStyle='#fff';ctx.font='bold 14px "Press Start 2P"';
      ctx.textAlign='center';ctx.fillText('TAP TO START',W/2,H/2);
    }
  }
  function flap(){
    if(dead) return;
    if(!started){started=true;pipeTimer=0;pipes=[];}
    bird.vy=JUMP;
  }
  function gameOver(){
    cancelAnimationFrame(raf);
    const wrap=document.querySelector('.canvas-wrap');
    wrap.style.position='relative';
    const ov=document.createElement('div');
    ov.className='game-over-screen';
    ov.innerHTML=`<div class="game-over-title" style="color:${g.color}">GAME OVER</div>
      <div class="game-over-score">Score: ${score}</div>
      <button class="restart-btn" style="background:${g.color};color:#000">PLAY AGAIN</button>`;
    wrap.appendChild(ov);
    ov.querySelector('.restart-btn').onclick=()=>{ov.remove();init();loop();};
  }
  const keyH=e=>{if(e.key===' '){flap();e.preventDefault();}if(e.key==='p'||e.key==='P')paused=!paused;};
  canvas.addEventListener('click',flap);
  document.addEventListener('keydown',keyH);
  stopCurrentGame=()=>{cancelAnimationFrame(raf);document.removeEventListener('keydown',keyH);};
  init();loop();
}

// =============================================
// WHACK A MOLE
// =============================================
function buildMole(container, g) {
  const HOLES=9,DURATION=30;
  container.innerHTML=`
    <div class="score-bar">
      <div class="score-item"><span class="score-label">SCORE</span><span class="score-val" id="molScore" style="color:${g.color}">0</span></div>
      <div class="score-item"><span class="score-label">TIME</span><span class="score-val" id="molTime">${DURATION}</span></div>
      <div class="score-item"><span class="score-label">BEST</span><span class="score-val" id="molBest">${getHS('mole')}</span></div>
    </div>
    <div class="dom-game">
      <div class="mole-grid" id="moleGrid"></div>
      <div class="how-to-play"><strong>HOW TO PLAY</strong>Click moles before they hide! ${DURATION} second challenge!</div>
    </div>
  `;
  let score=0,timeLeft=DURATION,gameTimer,moleTimers=[],active=Array(HOLES).fill(false),started=false;
  const grid=document.getElementById('moleGrid');

  for(let i=0;i<HOLES;i++){
    const hole=document.createElement('div');
    hole.className='mole-hole';
    hole.dataset.i=i;
    hole.innerHTML=`<span class="mole">🐹</span>`;
    hole.addEventListener('click',()=>{
      if(!started) startGame();
      if(active[i]){
        active[i]=false;
        hole.classList.remove('active');
        score++;
        document.getElementById('molScore').textContent=score;
        hole.style.transform='scale(1.2)';
        setTimeout(()=>hole.style.transform='',200);
      }
    });
    grid.appendChild(hole);
  }

  function startGame(){
    started=true;
    gameTimer=setInterval(()=>{
      timeLeft--;
      document.getElementById('molTime').textContent=timeLeft;
      if(timeLeft<=0){endGame();}
    },1000);
    popMoles();
  }

  function popMoles(){
    if(timeLeft<=0) return;
    const i=Math.floor(Math.random()*HOLES);
    if(!active[i]){
      active[i]=true;
      const hole=grid.children[i];
      hole.classList.add('active');
      const t=setTimeout(()=>{
        active[i]=false;
        hole.classList.remove('active');
      },700+Math.random()*600);
      moleTimers.push(t);
    }
    const next=400+Math.random()*400;
    const t=setTimeout(popMoles,next);
    moleTimers.push(t);
  }

  function endGame(){
    clearInterval(gameTimer);
    moleTimers.forEach(clearTimeout);
    active.fill(false);
    document.querySelectorAll('.mole-hole').forEach(h=>h.classList.remove('active'));
    setHS('mole',score);
    document.getElementById('molBest').textContent=getHS('mole');
    const dom=document.querySelector('.dom-game');
    const ov=document.createElement('div');
    ov.className='game-over-screen';ov.style.borderRadius='10px';
    ov.innerHTML=`<div class="game-over-title" style="color:${g.color}">TIME'S UP!</div>
      <div class="game-over-score">Score: ${score}</div>
      <button class="restart-btn" style="background:${g.color};color:#000">PLAY AGAIN</button>`;
    dom.style.position='relative';dom.appendChild(ov);
    ov.querySelector('.restart-btn').onclick=()=>{ov.remove();score=0;timeLeft=DURATION;started=false;
      document.getElementById('molScore').textContent='0';
      document.getElementById('molTime').textContent=DURATION;};
  }
  stopCurrentGame=()=>{clearInterval(gameTimer);moleTimers.forEach(clearTimeout);};
}

// =============================================
// BREAKOUT
// =============================================
function buildBreakout(container, g) {
  const W=480,H=400,PAD_W=80,PAD_H=10,BALL_R=7,BRICK_ROWS=5,BRICK_COLS=8,BRICK_H=20;
  container.innerHTML=`
    <div class="score-bar">
      <div class="score-item"><span class="score-label">SCORE</span><span class="score-val" id="brScore" style="color:${g.color}">0</span></div>
      <div class="score-item"><span class="score-label">LIVES</span><span class="score-val" id="brLives" style="color:${g.color}">3</span></div>
      <div class="score-item"><span class="score-label">BEST</span><span class="score-val" id="brBest">${getHS('breakout')}</span></div>
    </div>
    <div class="canvas-wrap">
      <canvas id="brCanvas" width="${W}" height="${H}" style="background:#050510; cursor:none"></canvas>
    </div>
    <div class="how-to-play"><strong>HOW TO PLAY</strong>Mouse or ← → to move paddle · Break all bricks! · P to pause</div>
  `;
  const canvas=document.getElementById('brCanvas');
  const ctx=canvas.getContext('2d');
  const BW=(W-40)/(BRICK_COLS+1);
  const BCOLORS=['#ff6b6b','#f97316','#ffd93d','#84cc16','#4ecdc4'];
  let pad,ball,bricks,score,lives,paused,dead,raf,keys={},mouseX;

  function init(){
    pad={x:W/2-PAD_W/2,y:H-30,w:PAD_W};
    ball={x:W/2,y:H-50,vx:3*(Math.random()>0.5?1:-1),vy:-4};
    bricks=[];
    for(let r=0;r<BRICK_ROWS;r++) for(let c=0;c<BRICK_COLS;c++){
      bricks.push({x:20+c*(BW+4),y:50+r*(BRICK_H+6),w:BW,h:BRICK_H,alive:true,color:BCOLORS[r]});
    }
    score=0;lives=3;paused=false;dead=false;
    document.getElementById('brScore').textContent='0';
    document.getElementById('brLives').textContent='3';
    loop();
  }
  function loop(){
    raf=requestAnimationFrame(loop);
    if(paused||dead) return;
    // paddle movement
    if(mouseX!==undefined) pad.x=Math.max(0,Math.min(W-pad.w,mouseX-pad.w/2));
    if(keys['ArrowLeft']) pad.x=Math.max(0,pad.x-6);
    if(keys['ArrowRight']) pad.x=Math.min(W-pad.w,pad.x+6);
    // ball
    ball.x+=ball.vx;ball.y+=ball.vy;
    if(ball.x-BALL_R<=0){ball.vx=Math.abs(ball.vx);}
    if(ball.x+BALL_R>=W){ball.vx=-Math.abs(ball.vx);}
    if(ball.y-BALL_R<=0){ball.vy=Math.abs(ball.vy);}
    // paddle
    if(ball.y+BALL_R>=pad.y&&ball.y-BALL_R<=pad.y+PAD_H&&ball.x>=pad.x&&ball.x<=pad.x+pad.w){
      const hit=(ball.x-(pad.x+pad.w/2))/(pad.w/2);
      ball.vx=hit*5;ball.vy=-Math.abs(ball.vy);
    }
    // ball lost
    if(ball.y>H+20){
      lives--;document.getElementById('brLives').textContent=lives;
      if(lives<=0){dead=true;gameOver();return;}
      ball={x:W/2,y:H-80,vx:3*(Math.random()>0.5?1:-1),vy:-4};
    }
    // bricks
    for(let b of bricks){
      if(!b.alive) continue;
      if(ball.x+BALL_R>b.x&&ball.x-BALL_R<b.x+b.w&&ball.y+BALL_R>b.y&&ball.y-BALL_R<b.y+b.h){
        b.alive=false;score+=10;
        document.getElementById('brScore').textContent=score;
        setHS('breakout',score);document.getElementById('brBest').textContent=getHS('breakout');
        // which side
        const overlapX=Math.min(ball.x+BALL_R-b.x, b.x+b.w-ball.x+BALL_R);
        const overlapY=Math.min(ball.y+BALL_R-b.y, b.y+b.h-ball.y+BALL_R);
        if(overlapX<overlapY) ball.vx*=-1; else ball.vy*=-1;
        break;
      }
    }
    if(bricks.every(b=>!b.alive)){dead=true;showWin();}
    draw();
  }
  function draw(){
    ctx.fillStyle='#050510';ctx.fillRect(0,0,W,H);
    bricks.forEach(b=>{
      if(!b.alive) return;
      ctx.fillStyle=b.color;
      ctx.shadowBlur=6;ctx.shadowColor=b.color;
      ctx.beginPath();ctx.roundRect(b.x,b.y,b.w,b.h,4);ctx.fill();
    });
    ctx.shadowBlur=0;
    // paddle
    ctx.fillStyle=g.color;ctx.shadowBlur=10;ctx.shadowColor=g.color;
    ctx.beginPath();ctx.roundRect(pad.x,pad.y,pad.w,PAD_H,5);ctx.fill();
    // ball
    ctx.beginPath();ctx.arc(ball.x,ball.y,BALL_R,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
  }
  function gameOver(){
    cancelAnimationFrame(raf);
    const wrap=document.querySelector('.canvas-wrap');wrap.style.position='relative';
    const ov=document.createElement('div');ov.className='game-over-screen';
    ov.innerHTML=`<div class="game-over-title" style="color:${g.color}">GAME OVER</div>
      <div class="game-over-score">Score: ${score}</div>
      <button class="restart-btn" style="background:${g.color};color:#000">PLAY AGAIN</button>`;
    wrap.appendChild(ov);ov.querySelector('.restart-btn').onclick=()=>{ov.remove();init();};
  }
  function showWin(){
    cancelAnimationFrame(raf);
    const wrap=document.querySelector('.canvas-wrap');wrap.style.position='relative';
    const ov=document.createElement('div');ov.className='game-over-screen';
    ov.innerHTML=`<div class="game-over-title" style="color:${g.color}">YOU WIN!</div>
      <div class="game-over-score">Score: ${score}</div>
      <button class="restart-btn" style="background:${g.color};color:#000">PLAY AGAIN</button>`;
    wrap.appendChild(ov);ov.querySelector('.restart-btn').onclick=()=>{ov.remove();init();};
  }
  const mm=e=>{const r=canvas.getBoundingClientRect();mouseX=e.clientX-r.left;};
  const keyD=e=>{keys[e.key]=true;if(e.key==='p'||e.key==='P')paused=!paused;if(['ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();};
  const keyU=e=>{keys[e.key]=false;};
  canvas.addEventListener('mousemove',mm);
  document.addEventListener('keydown',keyD);
  document.addEventListener('keyup',keyU);
  stopCurrentGame=()=>{cancelAnimationFrame(raf);canvas.removeEventListener('mousemove',mm);document.removeEventListener('keydown',keyD);document.removeEventListener('keyup',keyU);};
  init();
}

</script>
</body>
</html>
